<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Weather Dashboard</title>
</head>
<body>
    <div class="main-container">


        <!-- Header Section -->

        <div class="navbar">
            <h1 class="title">Sky Buddy</h1>
            <input type="text" placeholder="Enter a city" id="cityInput">
            <button class="button">Set up location</button>
        </div>


        <!-- Card section with daily temperature -->

        <div class="live-card">
            <div class="weather">
                <p class="temperature">15</p>
                <p class="region">Colombo, SriLanka</p>
            </div>
            <div class="date-time">
                <p class="time">08:30pm</p>
                <p class="date">2026-01-29<span class="weekday"> Wednsday</span></p>
            </div>
        </div>

        <!-- Details section -->
        <div class="details">
            <div class="details-grid">
                <div class="grid-item">
                    <div class="column1">
                       <i class="fa-solid fa-droplet"></i>
                    </div>
                    <div class="row">
                        <p class="weather-parameter"> Sunrise</p>
                        <p class="value" id="sunrise"></p>
                    </div>
                </div>
                <div class="grid-item">
                    <div>
                       <i class="fa-solid fa-droplet"></i>
                    </div>
                    <div class="row">
                        <p class="weather-parameter">Humidity</p>
                        <p class="value" id="humidity"></p>
                    </div>
                </div>
                <div class="grid-item">
                    <div>
                       <i class="fa-solid fa-droplet"></i>
                    </div>
                    <div class="row">
                        <p class="weather-parameter">Sunset</p>
                        <p class="value" id="sunset"></p>
                    </div>
                </div>
                <div class="grid-item">
                    <div>
                       <i class="fa-solid fa-droplet"></i>
                    </div>
                    <div class="row">
                        <p class="weather-parameter">Wind</p>
                        <p class="value" id="wind"></p>
                    </div>
                </div>
             <!-- Weekly predictions -->
                    
            </div>
            <div class="weekly-predictions">
                    <div class="card">
                        <p class="week-date">Mon</p>
                        <p class="day"></p>
                        <img src="" alt="" id="image"/>
                        <p class="wtemp"></p>
                    </div>
                     <div class="card">
                        <p class="week-date">Tue</p>
                        <p class="day"></p>
                        <img src="" alt="" id="image"/>
                        <p class="wtemp"></p>
                    </div>
                     <div class="card">
                        <p class="week-date">Wed</p>
                        <p class="day"></p>
                        <img src="" alt="" id="image"/>
                        <p  class="wtemp"></p>
                    </div>
                     <div class="card">
                        <p class="week-date">Thu</p>
                        <p class="day"></p>
                        <img src="" alt="" id="image"/>
                        <p class="wtemp"></p>
                    </div>
                     <div class="card">
                        <p class="week-date">Fri</p>
                        <p class="day"></p>
                        <img src="" alt="" id="image"/>
                        <p class="wtemp"></p>
                    </div>
                     <div class="card">  
                        <p class="week-date">Sat</p>
                        <p class="day"></p>
                        <img src="" alt="" id="image"/>
                        <p class="wtemp"></p>
                    </div>
                     <div class="card">
                        <p class="week-date">Sun</p>
                        <p class="day"></p>
                        <img src="" alt="" id="image"/>
                        <p class="wtemp"></p>
                    </div>

            </div>
        </div>

        </div>
        
    </div>
    <script src="https://kit.fontawesome.com/4f92095a34.js" crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>
</html>
