<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Weather Dashboard</title>
</head>
<body>
    <div class="main-container">
        <div class="navbar">
            <h1 class="title">Sky Buddy</h1>
            <input type="text" placeholder="Enter a city">
        </div>
        <div class="live-forecast">
            <div class="forecast">
                <h1 class="weather">15 &#8451;</h1>
                <h4 class="city-country">Colombo, SriLanka</h4>
            </div>
            <div class="date-time">
                <h4 class="time">08:30pm</h4>
                <p class="date">Night , Wednsday</p>
            </div>
        </div>
        <div class="details">
            <div class="weather-details">
                <div class="row">
                    <div class="column">
                        content
                    </div>
                    <div class="column">
                        content
                    </div>
                </div>
                <div class="row">
                     <div class="column">
                        content
                    </div>
                    <div class="column">
                        content
                    </div>
                </div>
            </div>
            <div class="weekly-predictions">
                    <div class="card">Mon</div>
                    <div class="card">Tue</div>
                    <div class="card">Wed</div>
                    <div class="card">Thu</div>
                    <div class="card">Fri</div>
                    <div class="card">Sat</div>
                    <div class="card">Sun</div>

            </div>
        </div>

        </div>
        
    </div>
</body>
</html>
