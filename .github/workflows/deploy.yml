name: Deploy Site

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Optional: Install Node.js if needed
      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Create a config file with the secret
      - name: Inject API Key
        run: |
          echo "const API_KEY = '${{ secrets.API_KEY }}';" > src/config.js

      # Build / deploy your site
      - name: Deploy
        run: |
          # Example: Copy files to server or deploy to GitHub Pages
          echo "Deploying site..."
